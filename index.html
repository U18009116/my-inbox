<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>My Inbox</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f2f2f7;--card:#fff;--text:#000;--sub:#6e6e73;--line:rgba(60,60,67,.18);--blue:#007aff;--green:#34c759;--orange:#ff9500;--red:#ff3b30;--purple:#af52de;--teal:#30b0c7;--gray:#8e8e93;--fill:rgba(120,120,128,.12)}
@media (prefers-color-scheme:dark){:root{--bg:#000;--card:#1c1c1e;--text:#fff;--sub:#98989f;--line:rgba(84,84,88,.6);--blue:#0a84ff;--green:#30d158;--orange:#ff9f0a;--red:#ff453a;--purple:#bf5af2;--teal:#40c8e0;--gray:#8e8e93;--fill:rgba(120,120,128,.24)}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.wrap{max-width:680px;margin:0 auto;padding:12px 16px calc(40px + env(safe-area-inset-bottom))}
header{padding:20px 4px 8px}
.date{color:var(--sub);font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.02em}
h1{font-size:34px;line-height:1.1;margin:2px 0 0;font-weight:700;letter-spacing:-.02em}
h2{font-size:20px;font-weight:700;margin:26px 4px 8px;letter-spacing:-.01em}
.card{background:var(--card);border-radius:14px;overflow:hidden}
.muted{color:var(--sub)}
.small{font-size:13px}
.search{display:flex;gap:8px;align-items:center;background:var(--fill);border-radius:12px;padding:9px 12px;margin-top:12px}
.search input{flex:1;border:0;background:none;color:var(--text);font:inherit;outline:none;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--blue);color:#fff;border-radius:12px;padding:12px 18px;font-weight:600}
.btn.ghost{background:var(--fill);color:var(--blue)}
.row{display:flex;gap:12px;padding:12px 14px;align-items:flex-start;position:relative;width:100%;text-align:left}
.row+.row{border-top:.5px solid var(--line)}
.av{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:600;font-size:15px}
.main{flex:1;min-width:0}
.line1{display:flex;gap:8px;justify-content:space-between}
.from{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.time{color:var(--sub);font-size:13px;flex:none}
.subj{margin:1px 0 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prev{margin:2px 0 0;color:var(--sub);font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.dot{position:absolute;left:4px;top:26px;width:8px;height:8px;border-radius:50%;background:var(--blue)}
.acts{display:flex;flex-direction:column;gap:6px}
.fb{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--fill);color:var(--sub);font-size:16px}
.fb[aria-pressed=true].star{background:var(--orange);color:#fff}
.fb[aria-pressed=true].down{background:var(--gray);color:#fff}
.seg{display:flex;background:var(--fill);border-radius:9px;padding:2px;margin:0 0 10px;overflow-x:auto}
.seg button{flex:1;padding:6px 8px;border-radius:7px;font-size:13px;font-weight:600;white-space:nowrap}
.seg button[aria-pressed=true]{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.cal{flex:none;width:44px;border-radius:10px;overflow:hidden;text-align:center;background:var(--fill)}
.cal b{display:block;background:var(--red);color:#fff;font-size:10px;padding:2px 0;text-transform:uppercase}
.cal span{display:block;font-size:19px;font-weight:600;padding:2px 0 3px}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;color:#fff;margin-top:5px}
.empty{padding:22px 14px;text-align:center;color:var(--sub)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--card);border-radius:14px;padding:12px}
.stat b{display:block;font-size:24px}
.center{min-height:70vh;display:grid;place-items:center;text-align:center}
.center p{max-width:320px;margin:10px auto 22px;color:var(--sub)}
/* reader */
#reader{position:fixed;inset:0;background:var(--bg);z-index:10;display:none;flex-direction:column}
#reader.open{display:flex}
.bar{display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;background:var(--card);border-bottom:.5px solid var(--line)}
.bar .t{flex:1;font-weight:600;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar button{color:var(--blue);font-size:17px;padding:4px 6px;min-width:60px}
.scroll{flex:1;overflow:auto;-webkit-overflow-scrolling:touch}
.msg{background:var(--card);margin:12px;border-radius:14px;padding:14px}
.msg h3{margin:0 0 4px;font-size:19px}
.msg .meta{color:var(--sub);font-size:13px;margin-bottom:10px}
.msg iframe{width:100%;border:0;background:#fff;border-radius:8px;min-height:120px}
.msg pre{white-space:pre-wrap;word-wrap:break-word;font:inherit;margin:0}
.atts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.att{display:flex;align-items:center;gap:8px;background:var(--fill);border-radius:10px;padding:9px 12px;font-size:14px;font-weight:600;max-width:100%}
.att span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#pdf canvas{display:block;width:100%;margin:0 0 8px;background:#fff}
#pdf{padding:10px}
.spin{width:22px;height:22px;border:3px solid var(--fill);border-top-color:var(--blue);border-radius:50%;animation:s 1s linear infinite;margin:30px auto}
@keyframes s{to{transform:rotate(360deg)}}
/* opening animation: an envelope opens and a letter slides out */
.mail-anim{position:relative;width:120px;height:124px;margin:0 auto;perspective:500px}
.m-back{position:absolute;left:0;bottom:0;width:120px;height:78px;background:#0a5fd0;border-radius:10px;z-index:1}
.m-paper{position:absolute;left:12px;bottom:6px;width:96px;height:68px;background:#fff;border-radius:6px;box-shadow:0 2px 8px rgba(0,0,0,.18);padding:13px 11px;z-index:2;animation:m-paper 2.6s ease-in-out infinite}
.m-paper i{display:block;height:5px;border-radius:3px;background:#cfd8e6;margin-bottom:8px}
.m-paper i:nth-child(2){width:78%}.m-paper i:nth-child(3){width:55%}
.m-front{position:absolute;left:0;bottom:0;width:120px;height:78px;background:linear-gradient(#3a9bff,#1a7cf0);border-radius:10px;z-index:3;clip-path:polygon(0 0,50% 58%,100% 0,100% 100%,0 100%)}
.m-flap{position:absolute;left:0;top:46px;width:120px;height:46px;background:#2a8af5;transform-origin:top center;clip-path:polygon(0 0,100% 0,50% 100%);z-index:4;animation:m-flap 2.6s ease-in-out infinite}
@keyframes m-flap{0%{transform:rotateX(0);z-index:4}20%{transform:rotateX(180deg);z-index:0}80%{transform:rotateX(180deg);z-index:0}100%{transform:rotateX(0);z-index:4}}
@keyframes m-paper{0%,22%{transform:translateY(0)}48%,64%{transform:translateY(-50px)}84%,100%{transform:translateY(0)}}
.loading-text{margin-top:18px;color:var(--sub);font-size:15px;font-weight:500}
.sec-head{display:flex;align-items:center;justify-content:space-between;width:100%;margin:26px 0 8px;padding:0 4px;text-align:left}
.sec-head h2{margin:0}
.chev{color:var(--sub);font-size:24px;line-height:1;padding:2px 6px;transition:transform .2s}
.sec-head[aria-expanded=false] .chev{transform:rotate(-90deg)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(30,30,30,.92);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:20;display:none;max-width:90vw}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="center"><div><div class="mail-anim"><div class="m-back"></div><div class="m-paper"><i></i><i></i><i></i></div><div class="m-front"></div><div class="m-flap"></div></div><div class="loading-text">Opening your inbox…</div></div></div></div>

<div id="reader" role="dialog" aria-modal="true">
  <div class="bar"><button id="r-back">‹ Back</button><div class="t" id="r-title"></div><button id="r-extra" style="visibility:hidden">Share</button></div>
  <div class="scroll" id="r-body"></div>
</div>
<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
// ---- Settings (no secrets here: a Google "client ID" is public by design) ----
const CLIENT_ID = '177429821917-kcu5ejvtcvkhjt1cufv1imslthtv7mj2.apps.googleusercontent.com';
const SCOPES = 'https://www.googleapis.com/auth/gmail.modify https://www.googleapis.com/auth/drive.readonly https://www.googleapis.com/auth/drive.file';
const DATA_FILE = 'my-inbox-data.json';       // written by the 7am agent
const FEEDBACK_FILE = 'my-inbox-feedback.json'; // written by this app, read by the 7am agent
const DRIVE_FOLDER = 'Claude';                  // everything is kept in this Drive folder
const APP_VERSION = 10;                          // shown at the bottom so Herman can see he has the newest copy

if (window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then((r) => r.update()).catch(() => {});
  // When a newer version takes over, reload once so it shows straight away
  let reloaded = !navigator.serviceWorker.controller; // first visit: nothing old to replace
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (!reloaded) { reloaded = true; location.reload(); } });
}

const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const S = { token: null, exp: 0, data: null, feedback: {}, fbFileId: null, kind: 'all', results: null, query: '' };
let tokenClient, tokenWait = null;

function toast(msg, ms = 2600) { const t = $('toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(t._h); t._h = setTimeout(() => (t.style.display = 'none'), ms); }

// ---------- Google sign-in (same page, no pop-up window) ----------
const REDIRECT = location.origin + location.pathname;
function goSignIn(silent) {
  const state = Math.random().toString(36).slice(2);
  try { sessionStorage.setItem('mi_state', state); } catch (e) {}
  const p = new URLSearchParams({ client_id: CLIENT_ID, redirect_uri: REDIRECT, response_type: 'token', scope: SCOPES, include_granted_scopes: 'true', state });
  if (silent) p.set('prompt', 'none');
  const hint = localStorageGet('hint'); if (hint) p.set('login_hint', hint);
  location.assign('https://accounts.google.com/o/oauth2/v2/auth?' + p.toString());
}
// Reads the sign-in result Google sends back in the address (#access_token=...). Returns 'ok', 'error' or null.
function readRedirect() {
  if (!location.hash || location.hash.length < 2) return null;
  const h = new URLSearchParams(location.hash.slice(1));
  if (!h.has('access_token') && !h.has('error')) return null;
  history.replaceState(null, '', REDIRECT);
  let want = null; try { want = sessionStorage.getItem('mi_state'); sessionStorage.removeItem('mi_state'); } catch (e) {}
  if (h.get('error') || (want && h.get('state') !== want)) return 'error';
  S.token = h.get('access_token'); S.exp = Date.now() + (Number(h.get('expires_in') || 3600) - 60) * 1000;
  try { localStorage.setItem('mi_tok', JSON.stringify([S.token, S.exp])); } catch (e) {}
  localStorageSet('signedin', '1');
  return 'ok';
}
function loadSavedToken() { try { const [t, e] = JSON.parse(localStorage.getItem('mi_tok') || '[]'); if (t && Date.now() < e) { S.token = t; S.exp = e; } } catch (e) {} }
// Last copy of the 7am summary, so the app can open instantly without a trip to Google's sign-in page
function cachedData() { try { return JSON.parse(localStorageGet('data') || 'null'); } catch (e) { return null; } }
function cachedFeedback() { try { return JSON.parse(localStorageGet('fb') || '{}'); } catch (e) { return {}; } }
// True when the 7am run (05:00 UTC) has happened since this copy was saved
function needsFresh(d) {
  const run = new Date(); run.setUTCHours(5, 20, 0, 0); if (run > new Date()) run.setUTCDate(run.getUTCDate() - 1);
  return !d || !d.updated_at || Date.parse(d.updated_at) < run.getTime();
}
function loader(text) {
  const c = el('div', 'center'), box = el('div'), a = el('div', 'mail-anim');
  const p = el('div', 'm-paper'); p.append(el('i'), el('i'), el('i'));
  a.append(el('div', 'm-back'), p, el('div', 'm-front'), el('div', 'm-flap'));
  box.append(a, el('div', 'loading-text', text || 'Opening your inbox…')); c.append(box); return c;
}
function getToken() {
  if (S.token && Date.now() < S.exp) return Promise.resolve();
  goSignIn(localStorageGet('signedin') === '1');
  return new Promise(() => {}); // the page is leaving for Google's sign-in
}
function localStorageGet(k) { try { return localStorage.getItem('mi_' + k); } catch (e) { return null; } }
function localStorageSet(k, v) { try { localStorage.setItem('mi_' + k, v); } catch (e) {} }

async function api(url, opts = {}) {
  await getToken(true);
  const r = await fetch(url, { ...opts, headers: { Authorization: 'Bearer ' + S.token, ...(opts.headers || {}) } });
  if (r.status === 401) { S.token = null; await getToken(true); return api(url, opts); }
  if (!r.ok) throw new Error('Google said ' + r.status);
  return r;
}
const G = 'https://gmail.googleapis.com/gmail/v1/users/me/';
const gmail = async (path, opts) => (await api(G + path, opts)).json();

// ---------- Drive: agent data + feedback ----------
async function driveFind(name, folder) {
  const q = encodeURIComponent(`name='${name}' and trashed=false` + (folder ? ` and mimeType='application/vnd.google-apps.folder' and 'root' in parents` : ''));
  const r = await (await api(`https://www.googleapis.com/drive/v3/files?q=${q}&orderBy=modifiedTime desc&fields=files(id,modifiedTime)&pageSize=1`)).json();
  return r.files && r.files[0];
}
async function driveRead(id) { return (await api(`https://www.googleapis.com/drive/v3/files/${id}?alt=media`)).json(); }
async function loadData() {
  try { const f = await driveFind(DATA_FILE); S.data = f ? await driveRead(f.id) : null; if (S.data) localStorageSet('data', JSON.stringify(S.data)); } catch (e) { S.data = cachedData(); }
  try { const f = await driveFind(FEEDBACK_FILE); if (f) { S.fbFileId = f.id; S.feedback = await driveRead(f.id) || {}; localStorageSet('fb', JSON.stringify(S.feedback)); } } catch (e) {}
}
async function saveFeedback() {
  const body = JSON.stringify(S.feedback);
  if (S.fbFileId) {
    await api(`https://www.googleapis.com/upload/drive/v3/files/${S.fbFileId}?uploadType=media`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body });
  } else {
    // Save it in the "Claude" folder in Drive; if Google won't allow that, save it loose and the 7am agent moves it there.
    const make = async (parents) => {
      const meta = { name: FEEDBACK_FILE, mimeType: 'application/json' }; if (parents) meta.parents = parents;
      const fd = new FormData();
      fd.append('metadata', new Blob([JSON.stringify(meta)], { type: 'application/json' }));
      fd.append('file', new Blob([body], { type: 'application/json' }));
      return (await api('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id', { method: 'POST', body: fd })).json();
    };
    let r;
    try { const f = await driveFind(DRIVE_FOLDER, true); r = await make(f ? [f.id] : null); } catch (e) { r = await make(null); }
    S.fbFileId = r.id;
  }
}

// ---------- helpers ----------
const COLORS = ['#ff9500', '#34c759', '#007aff', '#af52de', '#ff2d55', '#5856d6', '#30b0c7', '#a2845e'];
function avatar(name) { const n = String(name || '?').replace(/["<].*$/, '').trim() || '?'; const a = el('div', 'av', n[0].toUpperCase()); let h = 0; for (const c of n) h = (h * 31 + c.charCodeAt(0)) | 0; a.style.background = COLORS[Math.abs(h) % COLORS.length]; return a; }
const hdr = (m, name) => ((m.payload && m.payload.headers) || []).find((h) => h.name.toLowerCase() === name)?.value || '';
const nameOf = (from) => (from.match(/^\s*"?([^"<]+?)"?\s*</) || [, from])[1].trim();
function when(ms) { const d = new Date(+ms), now = new Date(); if (d.toDateString() === now.toDateString()) return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }); const y = new Date(now); y.setDate(now.getDate() - 1); if (d.toDateString() === y.toDateString()) return 'Yesterday'; return d.toLocaleDateString([], { day: 'numeric', month: 'short' }); }
function b64(s) { s = s.replace(/-/g, '+').replace(/_/g, '/'); const bin = atob(s); const u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u; }
const utf8 = (s) => new TextDecoder().decode(b64(s));
// On Android, launch the Gmail app itself (Google doesn't let web apps jump to one email inside it).
// Falls back to the Gmail website if the app can't be opened.
const IS_ANDROID = /Android/i.test(navigator.userAgent);
function gmailLink(frag) {
  const web = 'https://mail.google.com/mail/u/0/' + frag;
  if (!IS_ANDROID) return web;
  return 'intent:#Intent;action=android.intent.action.MAIN;category=android.intent.category.LAUNCHER;package=com.google.android.gm;S.browser_fallback_url=' + encodeURIComponent(web) + ';end';
}
function decodeEntities(s) { const t = document.createElement('textarea'); t.innerHTML = s || ''; return t.value; }

// ---------- screens ----------
function signInScreen(msg) {
  const app = $('app'); app.replaceChildren();
  const c = el('div', 'center'); const box = el('div');
  box.append(el('div', '', '📬'), el('h1', '', 'My Inbox'), el('p', '', msg || 'Sign in with your Google account to see your important emails and open attachments instantly.'));
  const b = el('button', 'btn', 'Sign in with Google');
  b.onclick = () => goSignIn(false);
  box.append(b); c.append(box); app.append(c);
  box.firstChild.style.fontSize = '56px';
}

async function start() {
  const app = $('app'); app.replaceChildren(loader());
  await loadData();
  render();
}

function render() {
  const app = $('app'); app.replaceChildren();
  const d = S.data || {}; const m = d.morning || {};
  const head = el('header');
  head.append(el('div', 'date', new Date().toLocaleDateString([], { weekday: 'long', day: 'numeric', month: 'long' })), el('h1', '', 'My Inbox'));
  const form = el('form', 'search'); const inp = el('input'); inp.type = 'search'; inp.placeholder = 'Search: e.g. graduation certificate'; inp.value = S.query; inp.enterKeyHint = 'search';
  form.append(el('span', 'muted', '🔍'), inp); form.onsubmit = (e) => { e.preventDefault(); search(inp.value.trim()); inp.blur(); };
  head.append(form); app.append(head);

  if (S.results) { app.append(resultsSection()); return; }

  // Refresh row
  const rr = el('div'); rr.style.cssText = 'display:flex;gap:10px;align-items:center;margin:14px 4px 0';
  const rb = el('button', 'btn ghost', S.checking ? 'Checking…' : '↻ Check new mail'); rb.onclick = liveCheck; rb.disabled = !!S.checking;
  rr.append(rb, el('span', 'muted small', d.updated_at ? 'Agent ran ' + when(Date.parse(d.updated_at)) : ''));
  app.append(rr);

  // New mail (from the button), shown straight under it
  if (S.checking || S.live) {
    const sec = el('section'); sec.id = 'new-mail';
    sec.append(el('h2', '', S.checking ? 'Checking Gmail…' : (S.live.length ? S.live.length + ' unread in your inbox' : 'New mail')));
    const c = el('div', 'card');
    if (S.checking) c.append(el('div', 'spin'));
    else if (!S.live.length) c.append(el('div', 'empty', 'No new mail ✨'));
    else S.live.forEach((x) => c.append(emailRow(x)));
    sec.append(c); app.append(sec);
  }

  // Trackers
  const trackers = Array.isArray(d.trackers) ? d.trackers : (d.trackers && Array.isArray(d.trackers.items) ? d.trackers.items : []);
  if (trackers.length) app.append(trackerSection(trackers));

  // Important
  const impOpen = localStorageGet('imp_closed') !== '1';
  const impHead = el('button', 'sec-head'); impHead.setAttribute('aria-expanded', String(impOpen));
  const impN = Array.isArray(m.emails) ? m.emails.length : 0;
  impHead.append(el('h2', '', 'Important' + (impN ? ' · ' + impN : '')), el('span', 'chev', '▾'));
  impHead.onclick = () => { localStorageSet('imp_closed', impOpen ? '1' : ''); render(); };
  app.append(impHead);
  const emails = Array.isArray(m.emails) ? m.emails : [];
  const card = el('div', 'card');
  if (emails.length) emails.forEach((x) => card.append(emailRow({ id: x.id || x.thread_id, from: x.from || x.from_email, title: x.title, preview: x.preview || x.detail, time: x.time, from_email: x.from_email })));
  else card.append(el('div', 'empty', S.data ? 'All clear ✨' : 'No summary from the 7am agent yet. Tap "Check new mail" to see your inbox.'));
  if (impOpen) app.append(card);

  // Drafts
  const nd = Number(m.drafts) || 0;
  if (nd) {
    const r = el('a', 'card row'); r.href = gmailLink('#drafts'); r.style.cssText = 'color:inherit;text-decoration:none;margin-top:12px';
    const av = el('div', 'av', '✎'); av.style.background = 'var(--gray)';
    const mm = el('div', 'main'); mm.append(el('div', 'from', nd + (nd === 1 ? ' draft reply' : ' draft replies') + ' waiting'), el('p', 'prev', 'Check and send them from Gmail'));
    r.append(av, mm); app.append(r);
  }

  // Clean-up stats
  if (m.date) {
    app.append(el('h2', '', 'Cleaned up'));
    const g = el('div', 'stats');
    [['Archived', (m.adverts_archived || 0) + (m.newsletters_archived || 0)], ['Unsubscribed', m.newsletters_unsubscribed], ['Spam', m.spam_moved]].forEach(([k, v]) => { const s = el('div', 'stat'); s.append(el('b', '', String(v || 0)), el('span', 'muted small', k)); g.append(s); });
    app.append(g);
  }
  const ver = el('p', 'muted small', 'My Inbox · version ' + APP_VERSION); ver.style.cssText = 'text-align:center;margin-top:28px'; app.append(ver);
}

const KINDS = { delivery: ['📦', 'var(--orange)', 'Deliveries'], ticket: ['🎟️', 'var(--purple)', 'Tickets'], meeting: ['👥', 'var(--blue)', 'Meetings'], bill: ['🧾', 'var(--red)', 'Bills'], booking: ['🧳', 'var(--teal)', 'Tickets'] };
const groupOf = (k) => (k === 'booking' ? 'ticket' : k);
function trackerSection(list) {
  // The tabs (Deliveries, Tickets, ...) always stay visible; only the list under them folds away
  const trOpen = localStorageGet('tr_closed') !== '1';
  const sec = el('section');
  const trHead = el('button', 'sec-head'); trHead.setAttribute('aria-expanded', String(trOpen));
  trHead.append(el('h2', '', 'Trackers'), el('span', 'chev', '▾'));
  trHead.onclick = () => { localStorageSet('tr_closed', trOpen ? '1' : ''); render(); };
  sec.append(trHead);
  const open = list.filter((t) => !['delivered', 'paid', 'cancelled'].includes(t.status) || (t.date && new Date(t.date) >= new Date(Date.now() - 864e5)));
  const seg = el('div', 'seg');
  [['all', 'All'], ['delivery', 'Deliveries'], ['ticket', 'Tickets'], ['meeting', 'Meetings'], ['bill', 'Bills']].forEach(([k, label]) => {
    const n = k === 'all' ? open.length : open.filter((t) => groupOf(t.kind) === k).length;
    const b = el('button', '', label + (n ? ' ' + n : '')); b.setAttribute('aria-pressed', String(S.kind === k)); b.onclick = () => { S.kind = k; localStorageSet('tr_closed', ''); render(); }; seg.append(b);
  });
  sec.append(seg);
  const card = el('div', 'card');
  const shown = open.filter((t) => S.kind === 'all' || groupOf(t.kind) === S.kind);
  if (!shown.length) card.append(el('div', 'empty', 'Nothing here'));
  shown.forEach((t) => {
    const k = KINDS[t.kind] || KINDS.delivery;
    const r = el('button', 'row');
    let lead;
    if (t.date && !isNaN(new Date(t.date))) { const dt = new Date(t.date); lead = el('div', 'cal'); lead.append(el('b', '', dt.toLocaleDateString([], { month: 'short' })), el('span', '', String(dt.getDate()))); }
    else { lead = el('div', 'av', k[0]); lead.style.background = k[1]; }
    const mm = el('div', 'main'); mm.append(el('div', 'from', t.title || k[2]));
    const meta = [t.from, t.time, t.place, t.ref].filter(Boolean).join(' · '); if (meta) mm.append(el('p', 'prev', meta));
    if (t.status) { const p = el('span', 'pill', String(t.status).replace(/_/g, ' ')); p.style.background = k[1]; mm.append(p); }
    r.append(lead, mm);
    const tid = t.thread_id || t.threadId || (String(t.gmail_url || '').match(/#[a-z]+\/([0-9a-f]{10,})/i) || [])[1]; if (tid) r.onclick = () => openThread(tid, t.title);
    card.append(r);
  });
  if (trOpen) sec.append(card); return sec;
}

function emailRow(x) {
  const r = el('div', 'row');
  if (x.unread) r.append(el('span', 'dot'));
  const mm = el('button', 'main'); mm.style.textAlign = 'left';
  const l1 = el('div', 'line1'); l1.append(el('span', 'from', nameOf(x.from || 'Unknown')), el('span', 'time', x.time || ''));
  mm.append(l1, el('p', 'subj', x.title || '(no subject)'));
  if (x.preview) mm.append(el('p', 'prev', x.preview));
  if (x.atts) mm.append(el('p', 'prev', '📎 ' + x.atts));
  mm.onclick = () => openThread(x.id, x.title);
  const acts = el('div', 'acts');
  const key = x.id; const fb = S.feedback[key] && S.feedback[key].verdict;
  const star = el('button', 'fb star', '★'); star.title = 'Always important'; star.setAttribute('aria-pressed', String(fb === 'important'));
  const down = el('button', 'fb down', '👎'); down.title = 'Not important'; down.setAttribute('aria-pressed', String(fb === 'not_important'));
  const set = async (v) => {
    if (S.feedback[key] && S.feedback[key].verdict === v) delete S.feedback[key];
    else S.feedback[key] = { verdict: v, thread_id: key, from: x.from || '', from_email: x.from_email || '', title: x.title || '', at: new Date().toISOString(), processed: false };
    star.setAttribute('aria-pressed', String(S.feedback[key]?.verdict === 'important')); down.setAttribute('aria-pressed', String(S.feedback[key]?.verdict === 'not_important'));
    try { await saveFeedback(); toast(S.feedback[key] ? 'Got it. The agent will learn this at 7am.' : 'Removed'); } catch (e) { toast('Couldn\'t save. Check your connection.'); }
  };
  star.onclick = () => set('important'); down.onclick = () => set('not_important');
  acts.append(star, down);
  r.append(avatar(x.from), mm, acts);
  return r;
}

// ---------- Live Gmail ----------
async function listThreads(q, max = 20) {
  const r = await gmail(`threads?maxResults=${max}&q=${encodeURIComponent(q)}`);
  const ts = r.threads || [];
  return Promise.all(ts.map(async (t) => {
    const th = await gmail(`threads/${t.id}?format=metadata&metadataHeaders=From&metadataHeaders=Subject`);
    const last = th.messages[th.messages.length - 1];
    const atts = [];
    return { id: t.id, from: hdr(last, 'from'), title: hdr(last, 'subject'), preview: decodeEntities(last.snippet), time: when(last.internalDate), unread: th.messages.some((m) => (m.labelIds || []).includes('UNREAD')), atts: atts.join(', ') };
  }));
}
async function liveCheck() {
  S.checking = true; render();
  const go = () => { const s = $('new-mail'); if (s) s.scrollIntoView({ behavior: 'smooth', block: 'start' }); };
  go();
  try { S.live = await listThreads('in:inbox is:unread -category:promotions -category:social -category:forums newer_than:14d', 25); }
  catch (e) { S.live = null; toast('Couldn\'t reach Gmail: ' + e.message, 4000); }
  S.checking = false; render(); go();
}
async function search(q) {
  S.query = q; if (!q) { S.results = null; render(); return; }
  S.results = 'loading'; render();
  // Plain words work; words like "certificate", "pdf", "invoice" also look inside attachments.
  let gq = q.replace(/^(go\s+)?(fetch|find|get|show|search( for)?|open)\s+(me\s+)?(my\s+)?/i, '');
  if (/\b(pdf|certificate|invoice|statement|ticket|document|attachment|file)s?\b/i.test(gq)) gq += ' has:attachment';
  try { S.results = await listThreads(gq, 20); if (!S.results.length) S.results = await listThreads(q, 20); }
  catch (e) { S.results = []; toast('Search failed: ' + e.message); }
  render();
}
function resultsSection() {
  const sec = el('section');
  const top = el('div'); top.style.cssText = 'display:flex;justify-content:space-between;align-items:center';
  top.append(el('h2', '', 'Results'));
  const back = el('button', '', 'Done'); back.style.cssText = 'color:var(--blue);font-weight:600;margin-top:16px'; back.onclick = () => { S.results = null; S.query = ''; render(); };
  top.append(back); sec.append(top);
  const card = el('div', 'card');
  if (S.results === 'loading') card.append(el('div', 'spin'));
  else if (!S.results.length) card.append(el('div', 'empty', 'Nothing found. Try other words.'));
  else S.results.forEach((x) => card.append(emailRow(x)));
  sec.append(card); return sec;
}

// ---------- Reader ----------
function walk(part, out) {
  if (!part) return;
  const mt = part.mimeType || '';
  if (part.filename && part.body && (part.body.attachmentId || part.body.data)) out.atts.push({ name: part.filename, mime: mt, id: part.body.attachmentId, data: part.body.data, size: part.body.size, inline: /inline/i.test((part.headers || []).find((h) => h.name.toLowerCase() === 'content-disposition')?.value || '') });
  else if (mt === 'text/html' && part.body && part.body.data) out.html = out.html || utf8(part.body.data);
  else if (mt === 'text/plain' && part.body && part.body.data) out.text = out.text || utf8(part.body.data);
  (part.parts || []).forEach((p) => walk(p, out));
}
function openReader(title) { $('r-title').textContent = title || ''; $('r-extra').style.visibility = 'hidden'; $('reader').classList.add('open'); history.pushState({ r: 1 }, ''); }
function closeReader() { $('reader').classList.remove('open'); $('r-body').replaceChildren(); }
$('r-back').onclick = () => history.back();
window.addEventListener('popstate', () => { if ($('pdf')) { showThread._last && showThread(...showThread._last); history.pushState({ r: 1 }, ''); } else closeReader(); });

async function openThread(id, title) { openReader(title); await showThread(id, title); }
async function showThread(id, title) {
  showThread._last = [id, title];
  $('r-title').textContent = title || ''; $('r-extra').style.visibility = 'hidden';
  const body = $('r-body'); body.replaceChildren(el('div', 'spin'));
  try {
    const th = await gmail(`threads/${id}?format=full`);
    body.replaceChildren();
    const unread = th.messages.filter((m) => (m.labelIds || []).includes('UNREAD')).length;
    th.messages.forEach((m) => {
      const out = { atts: [] }; walk(m.payload, out);
      const box = el('div', 'msg');
      box.append(el('h3', '', hdr(m, 'subject') || '(no subject)'), el('div', 'meta', nameOf(hdr(m, 'from')) + ' · ' + new Date(+m.internalDate).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' })));
      if (out.html) {
        const f = el('iframe'); f.setAttribute('sandbox', 'allow-popups allow-popups-to-escape-sandbox'); f.setAttribute('referrerpolicy', 'no-referrer');
        f.srcdoc = '<base target="_blank"><meta name="viewport" content="width=device-width"><style>body{margin:8px;font:15px -apple-system,Roboto,sans-serif;color:#111;word-wrap:break-word}img{max-width:100%;height:auto}table{max-width:100%!important}</style>' + out.html;
        f.onload = () => { try { f.style.height = (f.contentDocument.documentElement.scrollHeight + 20) + 'px'; } catch (e) { f.style.height = '70vh'; } };
        box.append(f);
      } else box.append(el('pre', '', out.text || decodeEntities(m.snippet)));
      const files = out.atts.filter((a) => !(a.inline && /^image\//.test(a.mime)));
      if (files.length) {
        const at = el('div', 'atts');
        files.forEach((a) => { const b = el('button', 'att'); b.append(el('b', '', /pdf/i.test(a.mime) ? '📄' : /^image/.test(a.mime) ? '🖼️' : '📎'), el('span', '', a.name)); b.onclick = () => openAttachment(m.id, a); at.append(b); });
        box.append(at);
      }
      body.append(box);
    });
    if (unread) gmail(`threads/${id}/modify`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ removeLabelIds: ['UNREAD'] }) }).catch(() => {});
    // Reply (opens the Gmail app's compose screen with the reply filled in) and open the Gmail app
    const last = th.messages[th.messages.length - 1];
    const replyTo = hdr(last, 'reply-to') || hdr(last, 'from');
    const addr = (replyTo.match(/<([^>]+)>/) || [, replyTo])[1].trim();
    const subj = hdr(last, 'subject');
    const acts = el('div'); acts.style.cssText = 'display:flex;gap:10px;margin:4px 12px 30px';
    const rp = el('a', 'btn', '↩ Reply in Gmail app'); rp.style.cssText = 'flex:1;text-decoration:none';
    rp.href = 'mailto:' + encodeURIComponent(addr) + '?subject=' + encodeURIComponent(/^re:/i.test(subj) ? subj : 'Re: ' + subj);
    // Find in Gmail app: copy a search for this email, then open the Gmail app so it can be pasted into Gmail's search
    const g = el('a', 'btn ghost', '🔍 Find in Gmail app'); g.style.cssText = 'flex:1;text-decoration:none';
    g.href = gmailLink('#all/' + id);
    // Exact search: sender + subject as a phrase + the day it arrived (one day either side), so only this email matches
    const d0 = new Date(+last.internalDate), ymd = (d) => d.getFullYear() + '/' + (d.getMonth() + 1) + '/' + d.getDate();
    const dayBefore = new Date(d0); dayBefore.setDate(d0.getDate() - 1); const dayAfter = new Date(d0); dayAfter.setDate(d0.getDate() + 1);
    const cleanSubj = subj.replace(/^((re|fwd?|aw):\s*)+/i, '').replace(/"/g, '').trim();
    const findText = [addr ? 'from:' + addr : '', cleanSubj ? 'subject:"' + cleanSubj + '"' : '', 'after:' + ymd(dayBefore), 'before:' + ymd(dayAfter)].filter(Boolean).join(' ');
    g.onclick = async (e) => {
      e.preventDefault();
      try { await navigator.clipboard.writeText(findText); toast('Copied. In Gmail, tap Search and paste.', 4000); } catch (err) { toast('Search Gmail for: ' + findText, 6000); }
      setTimeout(() => { location.href = g.href; }, 900);
    };
    acts.append(rp, g); body.append(acts);
    const tip = el('p', 'muted small', 'Find in Gmail app copies this email\'s sender and subject, then opens Gmail. Tap Search in Gmail and paste.');
    tip.style.cssText = 'margin:-18px 16px 30px;text-align:center'; body.append(tip);
  } catch (e) { body.replaceChildren(el('div', 'empty', 'Couldn\'t open this email: ' + e.message)); }
}

async function openAttachment(msgId, a) {
  $('r-title').textContent = a.name;
  const body = $('r-body'); body.replaceChildren(el('div', 'spin'));
  try {
    const data = a.id ? (await gmail(`messages/${msgId}/attachments/${a.id}`)).data : a.data;
    const bytes = b64(data);
    const blob = new Blob([bytes], { type: a.mime || 'application/octet-stream' });
    const file = new File([blob], a.name, { type: blob.type });
    const ex = $('r-extra'); ex.style.visibility = 'visible';
    ex.onclick = async () => {
      if (navigator.canShare && navigator.canShare({ files: [file] })) { try { await navigator.share({ files: [file], title: a.name }); } catch (e) {} }
      else { const u = URL.createObjectURL(blob); const l = el('a'); l.href = u; l.download = a.name; l.click(); setTimeout(() => URL.revokeObjectURL(u), 6e4); }
    };
    body.replaceChildren();
    if (/pdf/i.test(a.mime) || /\.pdf$/i.test(a.name)) {
      const box = el('div'); box.id = 'pdf'; body.append(box);
      const pdf = await pdfjsLib.getDocument({ data: bytes }).promise;
      const w = Math.min(body.clientWidth - 20, 900), dpr = window.devicePixelRatio || 1;
      for (let i = 1; i <= pdf.numPages; i++) {
        const p = await pdf.getPage(i); const v0 = p.getViewport({ scale: 1 }); const v = p.getViewport({ scale: (w / v0.width) * dpr });
        const c = el('canvas'); c.width = v.width; c.height = v.height; c.style.width = w + 'px'; box.append(c);
        await p.render({ canvasContext: c.getContext('2d'), viewport: v }).promise;
      }
    } else if (/^image\//.test(a.mime)) {
      const img = el('img'); img.src = URL.createObjectURL(blob); img.style.cssText = 'max-width:100%;display:block;margin:12px auto'; body.append(img);
    } else {
      const box = el('div', 'msg'); box.append(el('p', '', 'This file type can\'t be shown here. Tap Share to open it in another app.'));
      body.append(box);
    }
  } catch (e) { body.replaceChildren(el('div', 'empty', 'Couldn\'t open the file: ' + e.message)); }
}

// ---------- boot ----------
window.addEventListener('load', () => {
  const r = readRedirect();
  if (r === 'error') { localStorageSet('signedin', ''); signInScreen('Please sign in again to continue.'); return; }
  loadSavedToken();
  if (S.token) { start(); return; }
  if (localStorageGet('signedin') === '1') {
    // Sign-in has run out: show the saved summary straight away if it is still today's,
    // and only go back to Google when something new is needed (no loading bar on every open)
    const saved = cachedData();
    if (saved && !needsFresh(saved)) { S.data = saved; S.feedback = cachedFeedback(); render(); return; }
    goSignIn(true); return; // quietly renews without asking
  }
  signInScreen();
});
