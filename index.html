<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>My Inbox</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;1,800&display=swap" rel="stylesheet">
<style>
/* "Fight night" look: pure black, condensed heavy type, one red for what needs you, square corners */
:root{--bg:#000;--card:#151515;--fill:#232323;--line:#2b2b2b;--text:#fff;--sub:#a3a3a3;--red:#ff4b3e;--green:#2fd16f;--orange:#ff9f1c;--blue:#4fc3f7;--purple:#b388ff;--teal:#4dd0e1;--gray:#6b6b6b;--r:8px;
--head:-apple-system,BlinkMacSystemFont,'SF Pro Display',Inter,system-ui,sans-serif;--body:-apple-system,BlinkMacSystemFont,'SF Pro Text',Inter,system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 var(--body);-webkit-font-smoothing:antialiased;overscroll-behavior-y:contain}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.wrap{max-width:680px;margin:0 auto;padding:0 16px calc(96px + env(safe-area-inset-bottom))}
.topbar{position:sticky;top:0;z-index:5;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;margin:0 -16px;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;background:var(--bg);border-bottom:1px solid var(--line)}
.tb-date{color:var(--sub);font-size:13px}
.brand{font:italic 800 21px/1 var(--head);text-transform:uppercase;letter-spacing:-.02em}
.livepill{justify-self:end;background:var(--red);color:#fff;font:600 13px/1 var(--body);padding:7px 10px;border-radius:var(--r)}
.livepill.quiet{background:var(--fill);color:var(--sub)}
h1{font:italic 800 42px/1 var(--head);text-transform:uppercase;margin:6px 0 0}
h2{font:800 21px/1.15 var(--head);text-transform:uppercase;letter-spacing:-.01em;margin:28px 0 10px}
.hint{color:var(--sub);font-size:14px;margin:14px 0 0}
.muted{color:var(--sub)}.small{font-size:13px}
/* the one bold thing: your next event or delivery */
.feature{display:block;width:100%;text-align:left;margin-top:16px;padding:20px 18px 18px;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--k,var(--red));border-radius:var(--r);position:relative}
.f-kicker{display:block;color:var(--sub);font-size:14px;font-style:italic}
.f-title{display:block;font:italic 800 clamp(30px,9vw,48px)/1.02 var(--head);letter-spacing:-.02em;text-transform:uppercase;margin:10px 0 14px;overflow-wrap:anywhere}
.f-when{display:block;font-weight:600}
.f-sub{display:block;color:var(--sub);font-size:14px;margin-top:2px}
.f-count{position:absolute;top:16px;right:16px;background:var(--red);color:#fff;font:600 12px/1 var(--body);padding:6px 8px;border-radius:var(--r)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:flex;gap:12px;padding:14px;align-items:flex-start;position:relative;width:100%;text-align:left}
.row+.row{border-top:1px solid var(--line)}
.av{flex:none;width:40px;height:40px;border-radius:var(--r);display:grid;place-items:center;color:#fff;font:800 19px/1 var(--head)}
.main{flex:1;min-width:0}
.line1{display:flex;gap:8px;justify-content:space-between;align-items:baseline}
.from{font:700 15px/1.25 var(--head);letter-spacing:.01em;text-transform:uppercase;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.time{color:var(--sub);font-size:13px;flex:none}
.subj{margin:3px 0 0;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prev{margin:3px 0 0;color:var(--sub);font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.dot{position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--red)}
/* read emails fade back; unread ones stay bright white */
.row.read .from,.row.read .subj{color:#7a7a7a}.row.read .prev{color:#555}.row.read .av{opacity:.4}
.tcard.read .tname,.tcard.read .tsub{color:#7a7a7a}.tcard.read .tstatus,.tcard.read .tmeta{color:#555}.tcard.read .tdate{opacity:.45}
/* delivery timeline */
.tl{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:10px}.tl i{height:5px;background:var(--fill);border-radius:3px}.tl i.on{background:var(--orange)}
.tl-lb{display:flex;justify-content:space-between;color:var(--sub);font-size:11px;margin-top:4px}.tl-lb .now{color:var(--text);font-weight:600}
/* notifications card */
.notif{display:flex;gap:12px;align-items:center;padding:14px;margin-top:14px;border-left:4px solid var(--red)}
/* cleaned up */
.row.kv{justify-content:space-between;align-items:center}.row.kv b{font:800 20px/1 var(--head)}
.small-btn{flex:none;align-self:center;padding:8px 10px;font-size:13px}.btn:disabled{opacity:.6}
.empty{padding:22px 16px;color:var(--sub)}
.sec-head{display:flex;align-items:center;justify-content:space-between;width:100%;margin:28px 0 10px;text-align:left}
.sec-head h2{margin:0}
.chev{color:var(--sub);font-size:24px;line-height:1;padding:2px 6px;transition:transform .2s}
.sec-head[aria-expanded=false] .chev{transform:rotate(-90deg)}
.seg{display:flex;gap:6px;overflow-x:auto;margin:0 0 12px;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;padding:8px 12px;border:1px solid var(--line);border-radius:var(--r);font-size:14px;font-weight:600;color:var(--sub);white-space:nowrap}
.seg button[aria-pressed=true]{background:var(--text);color:#000;border-color:var(--text)}
/* trackers, styled like ranking cards */
.tlist{display:grid;gap:10px}
.tcard{display:flex;align-items:stretch;gap:14px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px;position:relative}
.tdate{flex:none;width:76px;min-height:76px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--fill);border-top:3px solid var(--k,var(--red));border-radius:var(--r)}
.tdate b{font:800 30px/1 var(--head);letter-spacing:-.02em}
.tdate span{color:var(--sub);font-size:13px;margin-top:2px}
.tbody{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;padding-right:30px}
.tstatus{color:var(--sub);font-size:13px}
.tname{font:800 17px/1.2 var(--head);letter-spacing:-.01em;text-transform:uppercase;margin:2px 0}
.tsub{font-size:15px}
.tmeta{color:var(--sub);font-size:13px}
.go{position:absolute;right:10px;bottom:10px;width:24px;height:24px;display:grid;place-items:center;background:var(--red);color:#fff;font-weight:700;border-radius:var(--r);line-height:1}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:var(--r);color:#fff;margin-top:5px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 12px}
.stat b{display:block;font:800 34px/1 var(--head);letter-spacing:-.02em}
.search{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.search input{flex:1;border:0;background:none;color:var(--text);font:inherit;outline:none;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--red);color:#fff;border-radius:var(--r);padding:13px 18px;font-weight:600}
.btn.ghost{background:var(--fill);color:var(--text)}
.center{min-height:70vh;display:grid;place-items:center;text-align:center}
.center p{max-width:320px;margin:10px auto 22px;color:var(--sub)}
/* bottom tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:6;display:grid;grid-template-columns:repeat(4,1fr);background:#000;border-top:1px solid var(--line);padding:9px 0 calc(9px + env(safe-area-inset-bottom))}
.tab{display:flex;flex-direction:column;align-items:center;gap:4px;color:#fff;font-size:12px;font-weight:500;position:relative}
.tab svg{width:24px;height:24px}
.tab[aria-current=true]{color:var(--red)}
.badge{position:absolute;top:-5px;left:calc(50% + 7px);background:var(--red);color:#fff;font:600 11px/1 var(--body);font-style:normal;padding:3px 5px;border-radius:var(--r)}
/* email reader */
#reader{position:fixed;inset:0;background:var(--bg);z-index:10;display:none;flex-direction:column}
#reader.open{display:flex}
.bar{display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;background:#000;border-bottom:1px solid var(--line)}
.bar .t{flex:1;font:700 16px/1.2 var(--head);text-transform:uppercase;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar button{color:var(--red);font-size:16px;font-weight:600;padding:4px 6px;min-width:64px}
.scroll{flex:1;overflow:auto;-webkit-overflow-scrolling:touch}
.msg{background:var(--card);border:1px solid var(--line);margin:12px;border-radius:var(--r);padding:16px}
.msg h3{margin:0 0 4px;font:800 20px/1.2 var(--head);letter-spacing:-.01em;text-transform:uppercase}
.msg .meta{color:var(--sub);font-size:13px;margin-bottom:12px}
.msg iframe{width:100%;border:0;background:#fff;border-radius:var(--r);min-height:120px}
.msg pre{white-space:pre-wrap;word-wrap:break-word;font:inherit;margin:0}
.atts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.att{display:flex;align-items:center;gap:8px;background:var(--fill);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;font-size:14px;font-weight:600;max-width:100%}
.att span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#pdf canvas{display:block;width:100%;margin:0 0 8px;background:#fff}
#pdf{padding:10px}
.spin{width:22px;height:22px;border:3px solid var(--fill);border-top-color:var(--red);border-radius:50%;animation:s 1s linear infinite;margin:30px auto}
@keyframes s{to{transform:rotate(360deg)}}
.fb{width:30px;height:30px;border-radius:var(--r);display:grid;place-items:center;background:var(--fill);color:var(--sub);font-size:15px;font-weight:700}
.fb[aria-pressed=true].star{background:var(--orange);color:#000}
.fb[aria-pressed=true].tick{background:var(--green);color:#000}
.fb[aria-pressed=true].cross{background:var(--red);color:#fff}
.imp{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 2px;border-top:1px solid var(--line)}
.imp .fb{flex:none;width:36px;height:36px;font-size:17px}
.imp-tx{display:flex;flex-direction:column;gap:1px}.imp-tx b{font:700 15px/1.25 var(--head);text-transform:uppercase}.imp-tx small{color:var(--sub);font-size:13px;line-height:1.3}
/* opening animation: an envelope opens and a letter slides out */
.mail-anim{position:relative;width:120px;height:124px;margin:0 auto;perspective:500px}
.m-back{position:absolute;left:0;bottom:0;width:120px;height:78px;background:#a8231b;border-radius:var(--r);z-index:1}
.m-paper{position:absolute;left:12px;bottom:6px;width:96px;height:68px;background:#fff;border-radius:var(--r);box-shadow:0 2px 8px rgba(0,0,0,.4);padding:13px 11px;z-index:2;animation:m-paper 2.6s ease-in-out infinite}
.m-paper i{display:block;height:5px;background:#d4d4d4;margin-bottom:8px}
.m-paper i:nth-child(2){width:78%}.m-paper i:nth-child(3){width:55%}
.m-front{position:absolute;left:0;bottom:0;width:120px;height:78px;background:var(--red);border-radius:var(--r);z-index:3;clip-path:polygon(0 0,50% 58%,100% 0,100% 100%,0 100%)}
.m-flap{position:absolute;left:0;top:46px;width:120px;height:46px;background:#e03a2f;transform-origin:top center;clip-path:polygon(0 0,100% 0,50% 100%);z-index:4;animation:m-flap 2.6s ease-in-out infinite}
@keyframes m-flap{0%{transform:rotateX(0);z-index:4}20%{transform:rotateX(180deg);z-index:0}80%{transform:rotateX(180deg);z-index:0}100%{transform:rotateX(0);z-index:4}}
@keyframes m-paper{0%,22%{transform:translateY(0)}48%,64%{transform:translateY(-50px)}84%,100%{transform:translateY(0)}}
@media (prefers-reduced-motion:reduce){.m-flap,.m-paper,.spin{animation-duration:6s}}
.loading-text{margin-top:18px;color:var(--sub);font:italic 600 15px/1 var(--head);text-transform:uppercase}
/* pull down from the top to check new mail */
.ptr{position:fixed;top:0;left:0;right:0;display:flex;justify-content:center;pointer-events:none;z-index:15;transform:translateY(-70px);transition:transform .25s}
.ptr div{margin-top:calc(10px + env(safe-area-inset-top));background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:8px 16px;font-size:14px;font-weight:600;color:var(--red)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#fff;color:#000;padding:10px 16px;border-radius:var(--r);font-size:14px;font-weight:500;z-index:20;display:none;max-width:90vw}
/* v24 finish: sentence case, fewer boxes, red only for what needs you, one bold element (the Next up date) */
h2,.from,.tname,.msg h3,.imp-tx b,.bar .t,.loading-text{text-transform:none}
h2{font:700 22px/1.2 var(--head);letter-spacing:-.02em;margin:32px 0 6px}
.brand{font:800 19px/1 var(--head);font-style:normal;letter-spacing:-.03em;text-transform:none}
.livepill{border-radius:999px;font-variant-numeric:tabular-nums;padding:6px 11px}
.hint{font-size:13px;color:#8a8a8a}
.card{background:transparent;border:0;border-radius:0;overflow:visible}
.row{padding:14px 2px}
.row+.row{border-top:1px solid #1d1d1d}
.av{background:#1c1c1e!important;color:#f2f2f2;font:600 16px/1 var(--body);border-radius:50%}
.row.read .av{color:#5c5c5c}
.from{font:600 15px/1.25 var(--body);letter-spacing:0}
.subj{font-weight:500;color:#e6e6e6}
.row.read .subj{color:#7a7a7a}
.dot{left:-10px;top:21px;bottom:auto;width:6px;height:6px;border-radius:50%}
.sec-head{margin:32px 0 6px}
.chev{color:#6b6b6b}
.empty{padding:18px 2px}
.feature{display:grid;grid-template-columns:auto 1fr;column-gap:18px;align-items:center;background:#111112;border:0;border-radius:18px;padding:20px 18px}
.f-kicker{display:none}
.f-date{grid-row:1/span 4;display:flex;flex-direction:column;align-items:center;padding-right:18px;border-right:2px solid var(--k,var(--red))}
.f-date b{font:800 58px/.9 var(--head);letter-spacing:-.05em;font-variant-numeric:tabular-nums}
.f-date small{color:#9a9a9a;font-size:13px;margin-top:6px}
.f-title{grid-column:2;font:800 23px/1.15 var(--head);font-style:normal;text-transform:none;letter-spacing:-.02em;margin:0 0 8px;padding-right:72px}
.f-when,.f-sub{grid-column:2}
.f-when{font-weight:500;color:#d6d6d6;font-size:15px}
.f-count{border-radius:999px;background:transparent;color:var(--red);border:1px solid #4a1a16;top:18px;right:16px}
.seg button{border-radius:999px;border-color:#262626;color:#9a9a9a}
.tlist{gap:0}
.tcard{background:transparent;border:0;border-bottom:1px solid #1d1d1d;border-radius:0;padding:14px 2px}
.tdate{background:#141414;border-top:0;border-left:3px solid var(--k,var(--red));border-radius:12px;width:62px;min-height:62px}
.tdate b{font:800 26px/1 var(--head);font-variant-numeric:tabular-nums}
.tname{font:650 17px/1.25 var(--head);letter-spacing:-.01em}
.tstatus{color:#8a8a8a}
.go{background:transparent;color:#5c5c5c;font-size:24px;top:50%;bottom:auto;transform:translateY(-50%);right:2px}
.tl i.on{background:var(--k,var(--orange))}
.search{border:0;background:#141414;border-radius:14px}
.notif{border:0;border-radius:16px;background:#141414;padding:14px 16px}
.row.kv b{font:700 22px/1 var(--head);font-variant-numeric:tabular-nums}
.btn{border-radius:12px}
.btn.ghost{background:#1c1c1e}
.tabbar{background:rgba(0,0,0,.92);border-top:1px solid #1a1a1a}
.tab{color:#8a8a8a}
.tab[aria-current=true]{color:#fff}
.tab[aria-current=true]::before{content:'';position:absolute;top:-9px;width:20px;height:2px;border-radius:2px;background:var(--red)}
.badge{border-radius:999px;min-width:17px;text-align:center;font-variant-numeric:tabular-nums}
.msg{background:#111112;border:0;border-radius:16px}
.imp{border-top:1px solid #1d1d1d}
.f-count{position:static;grid-column:2;justify-self:start;margin-bottom:10px;padding:5px 9px}
.f-title{padding-right:0;overflow-wrap:normal;word-break:normal;hyphens:auto}
main{padding-bottom:28px}
.tb-left{display:flex;align-items:center;gap:10px;min-width:0}
.gear{position:relative;flex:none;width:32px;height:32px;border-radius:50%;background:#1c1c1e;color:#d6d6d6;display:grid;place-items:center}
.gear.dot::after{content:'';position:absolute;top:1px;right:1px;width:8px;height:8px;border-radius:50%;background:var(--red);box-shadow:0 0 0 2px #000}
.set-list{padding:16px}
.set-row{display:flex;align-items:center;gap:10px;width:100%;padding:16px;background:#141414;border-radius:14px;color:#f2f2f2;font:500 16px/1.2 var(--body);text-align:left}
.set-row .set-val{margin-left:auto;color:#8a8a8a;font-size:15px;font-variant-numeric:tabular-nums}
.set-row .set-new{width:8px;height:8px;border-radius:50%;background:var(--red)}
.set-row .set-chev{color:#5c5c5c;font-size:22px;line-height:1}
.about{padding:44px 24px;text-align:center}
.about-name{font:800 26px/1.1 var(--head);letter-spacing:-.02em}
.about-ver{color:#9a9a9a;margin-top:6px;font-size:15px;font-variant-numeric:tabular-nums}
.about-note{color:#8a8a8a;font-size:14px;margin:28px auto 14px;max-width:280px}
.about .btn{width:100%;max-width:300px}
.btn:disabled{opacity:.6}
</style>
</head>

function goSignIn(silent) {

}
// Reads the sign-in result Google sends back in the address (#access_token=...). Returns 'ok', 'error' or null.
function readRedirect() {

  const h = new URLSearchParams(location.hash.slice(1));
  if (!h.has('access_token') && !h.has('error')) return null;
  history.replaceState(null, '', REDIRECT);
  let want = null; try { want = sessionStorage.getItem('mi_state'); sessionStorage.removeItem('mi_state'); } catch (e) {}
  if (h.get('error') || (want && h.get('state') !== want)) return 'error';
  S.token = h.get('access_token'); S.exp = Date.now() + (Number(h.get('expires_in') || 3600) - 60) * 1000;
  try { localStorage.setItem('mi_tok', JSON.stringify([S.token, S.exp])); } catch (e) {}
  localStorageSet('signedin', '1');
  return 'ok';
}
function loadSavedToken() { try { const [t, e] = JSON.parse(localStorage.getItem('mi_tok') || '[]'); if (t && Date.now() < e) { S.token = t; S.exp = e; } } catch (e) {} }
// Last copy of the 7am summary, so the app can open instantly without a trip to Google's sign-in page
function cachedData() { try { return JSON.parse(localStorageGet('data') || 'null'); } catch (e) { return null; } }
// Which emails are still unread in Gmail (bright white) and which are read (greyed out)
function loadUnread() { try { const a = JSON.parse(localStorageGet('unread') || 'null'); if (Array.isArray(a)) S.unreadIds = new Set(a); } catch (e) {} }
function saveUnread() { if (S.unreadIds) localStorageSet('unread', JSON.stringify([...S.unreadIds])); }
function isUnread(id) { return S.unreadIds ? S.unreadIds.has(id) : true; }
function setUnread(id, on) { if (!S.unreadIds) S.unreadIds = new Set(); if (on) S.unreadIds.add(id); else S.unreadIds.delete(id); saveUnread(); }
async function fetchUnread() { const r = await gmail('threads?maxResults=300&q=' + encodeURIComponent('is:unread newer_than:90d')); S.unreadIds = new Set((r.threads || []).map((t) => t.id)); saveUnread(); }
// Draft replies waiting in Gmail
async function loadDrafts() {
  const r = await gmail('drafts?maxResults=10');
  S.drafts = await Promise.all((r.drafts || []).map(async (dr) => {
    const g = await gmail(`drafts/${dr.id}?format=metadata`); const msg = g.message || {};
    return { id: dr.id, to: hdr(msg, 'to'), subject: hdr(msg, 'subject'), snippet: decodeEntities(msg.snippet || ''), time: msg.internalDate ? when(msg.internalDate) : '' };
  }));

// Morning notifications from My Inbox (Web Push). The 7am agent sends them; this saves where to send them.
function fromB64url(s) { const b = atob(s.replace(/-/g, '+').replace(/_/g, '/') + '='.repeat((4 - s.length % 4) % 4)); return Uint8Array.from(b, (ch) => ch.charCodeAt(0)); }
async function saveJsonToDrive(name, obj) {
  const body = JSON.stringify(obj); let f = null; try { f = await driveFind(name); } catch (e) {}
  if (f) { await api('https://www.googleapis.com/upload/drive/v3/files/' + f.id + '?uploadType=media', { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body }); return; }
  const make = async (parents) => {
    const meta = { name, mimeType: 'application/json' }; if (parents) meta.parents = parents;
    const fd = new FormData(); fd.append('metadata', new Blob([JSON.stringify(meta)], { type: 'application/json' })); fd.append('file', new Blob([body], { type: 'application/json' }));
    return (await api('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id', { method: 'POST', body: fd })).json();
  };
  try { const d = await driveFind(DRIVE_FOLDER, true); await make(d ? [d.id] : null); } catch (e) { await make(null); }
}
async function enablePush(btn) {
  try {
    if (btn) btn.disabled = true;
    const perm = await Notification.requestPermission();
    if (perm !== 'granted') { toast('Notifications are blocked. Allow them for this site in Chrome settings, then tap Turn on again.', 5000); if (btn) btn.disabled = false; return; }
    const reg = await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: fromB64url(PUSH_KEY) });
    await saveJsonToDrive(PUSH_FILE, { subscription: sub.toJSON(), saved_at: new Date().toISOString() });
    localStorageSet('push', '1'); toast('Notifications are on. Your 7am summary will come from My Inbox.', 4000); render();
  } catch (e) { if (btn) btn.disabled = false; toast('Couldn\'t turn on notifications: ' + e.message, 5000); }
}
// Fetch the newest summary, trackers, read/unread and drafts, then redraw where Herman is
async function refreshData() {
  if (S.refreshing) return;
  if (!S.token || Date.now() >= S.exp) { goSignIn(true); return; } // quick Google sign-in, comes straight back to this tab
  S.refreshing = true;
  try { await loadData(); } catch (e) {}
  S.refreshing = false;
  if (!$('reader').classList.contains('open')) { const y = window.scrollY; render(); window.scrollTo(0, y); }
}
function cachedFeedback() { try { return JSON.parse(localStorageGet('fb') || '{}'); } catch (e) { return {}; } }
// True when the 7am run (05:00 UTC) has happened since this copy was saved
function needsFresh(d) {
  // Agent runs at 07:00, 13:00 and 17:00 SAST (05:00, 11:00, 15:00 UTC): find the latest one that has finished
  const now = new Date(); const runs = [5, 11, 15].map((h) => { const r = new Date(now); r.setUTCHours(h, 20, 0, 0); return r; }).filter((r) => r <= now);
  const run = runs.length ? runs[runs.length - 1] : (() => { const r = new Date(now); r.setUTCDate(r.getUTCDate() - 1); r.setUTCHours(15, 20, 0, 0); return r; })();
  return !d || !d.updated_at || Date.parse(d.updated_at) < run.getTime();
}
function loader(text) {

function getToken() {
  if (S.token && Date.now() < S.exp) return Promise.resolve();

  return new Promise(() => {}); // the page is leaving for Google's sign-in
}
function localStorageGet(k) { try { return localStorage.getItem('mi_' + k); } catch (e) { return null; } }
function localStorageSet(k, v) { try { localStorage.setItem('mi_' + k, v); } catch (e) {} }

async function api(url, opts = {}) {
  await getToken(true);
  const r = await fetch(url, { ...opts, headers: { Authorization: 'Bearer ' + S.token, ...(opts.headers || {}) } });
  if (r.status === 401) { S.token = null; await getToken(true); return api(url, opts); }
  if (!r.ok) throw new Error('Google said ' + r.status);
  return r;
}
const G = 'https://gmail.googleapis.com/gmail/v1/users/me/';
const gmail = async (path, opts) => (await api(G + path, opts)).json();

// ---------- Drive: agent data + feedback ----------
async function driveFind(name, folder) {
  const q = encodeURIComponent(`name='${name}' and trashed=false` + (folder ? ` and mimeType='application/vnd.google-apps.folder' and 'root' in parents` : ''));
  const r = await (await api(`https://www.googleapis.com/drive/v3/files?q=${q}&orderBy=modifiedTime desc&fields=files(id,modifiedTime)&pageSize=1`)).json();
  return r.files && r.files[0];
}
async function driveRead(id) { return (await api(`https://www.googleapis.com/drive/v3/files/${id}?alt=media`)).json(); }
async function loadData() {
  try { const f = await driveFind(DATA_FILE); S.data = f ? await driveRead(f.id) : null; if (S.data) localStorageSet('data', JSON.stringify(S.data)); } catch (e) { S.data = cachedData(); }
  try { await fetchUnread(); } catch (e) {}
  try { await loadDrafts(); } catch (e) { S.drafts = null; }
  try { const f = await driveFind(FEEDBACK_FILE); if (f) { S.fbFileId = f.id; S.feedback = await driveRead(f.id) || {}; localStorageSet('fb', JSON.stringify(S.feedback)); } } catch (e) {}
}
async function saveFeedback() {
  const body = JSON.stringify(S.feedback);
  if (S.fbFileId) {
    await api(`https://www.googleapis.com/upload/drive/v3/files/${S.fbFileId}?uploadType=media`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body });
  } else {
    // Save it in the "Claude" folder in Drive; if Google won't allow that, save it loose and the 7am agent moves it there.
    const make = async (parents) => {
      const meta = { name: FEEDBACK_FILE, mimeType: 'application/json' }; if (parents) meta.parents = parents;
      const fd = new FormData();
      fd.append('metadata', new Blob([JSON.stringify(meta)], { type: 'application/json' }));
      fd.append('file', new Blob([body], { type: 'application/json' }));
      return (await api('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id', { method: 'POST', body: fd })).json();
    };
    let r;
    try { const f = await driveFind(DRIVE_FOLDER, true); r = await make(f ? [f.id] : null); } catch (e) { r = await make(null); }
    S.fbFileId = r.id;
  }
}

const COLORS = ['#ff9500', '#34c759', '#007aff', '#af52de', '#ff2d55', '#5856d6', '#30b0c7', '#a2845e'];
function avatar(name) { const n = String(name || '?').replace(/["<].*$/, '').trim() || '?'; const a = el('div', 'av', n[0].toUpperCase()); let h = 0; for (const c of n) h = (h * 31 + c.charCodeAt(0)) | 0; a.style.background = COLORS[Math.abs(h) % COLORS.length]; return a; }
const hdr = (m, name) => ((m.payload && m.payload.headers) || []).find((h) => h.name.toLowerCase() === name)?.value || '';
const nameOf = (from) => (from.match(/^\s*"?([^"<]+?)"?\s*</) || [, from])[1].trim();
function when(ms) { const d = new Date(+ms), now = new Date(); if (d.toDateString() === now.toDateString()) return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }); const y = new Date(now); y.setDate(now.getDate() - 1); if (d.toDateString() === y.toDateString()) return 'Yesterday'; return d.toLocaleDateString([], { day: 'numeric', month: 'short' }); }
function b64(s) { s = s.replace(/-/g, '+').replace(/_/g, '/'); const bin = atob(s); const u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u; }
const utf8 = (s) => new TextDecoder().decode(b64(s));
// On Android, launch the Gmail app itself (Google doesn't let web apps jump to one email inside it).
// Falls back to the Gmail website if the app can't be opened.
const IS_ANDROID = /Android/i.test(navigator.userAgent);

async function start() {
  // Show the last saved copy straight away (no waiting), then fetch the newest quietly in the background
  const saved = cachedData();
  if (saved) { S.data = saved; S.feedback = cachedFeedback(); render(); } else $('app').replaceChildren(loader());
  await loadData();
  { const y = window.scrollY; render(); window.scrollTo(0, y); }
  // Notifications allowed but the phone's address never got saved (e.g. sign-in interrupted it): finish quietly now
  if ('PushManager' in window && 'Notification' in window && Notification.permission === 'granted' && localStorageGet('push') !== '1') enablePush(null);
}

function openTrackers(list) {
  // Trackers stay until their date has passed, then drop off (ones without a date stay until done)
  const today = new Date(new Date().toDateString());
  return list.filter((t) => (t.date && !isNaN(new Date(t.date))) ? new Date(t.date) >= today : !['delivered', 'paid', 'cancelled'].includes(t.status));
}
function trackerThread(t) { return t.thread_id || t.threadId || (String(t.gmail_url || '').match(/#[a-z]+\/([0-9a-f]{10,})/i) || [])[1]; }
function nextUp(list) {
  const today = new Date(new Date().toDateString());
  return openTrackers(list).filter((t) => t.date && !isNaN(new Date(t.date)) && new Date(t.date) >= today).sort((a, b) => new Date(a.date) - new Date(b.date))[0];
}

function inboxTab(page, d, m, emails, trackers) {

}

function cleanTab(page, d, m) {

  const c = el('div', 'card');
  [['Adverts archived', m.adverts_archived], ['Newsletters archived', m.newsletters_archived], ['Unsubscribed', m.newsletters_unsubscribed], ['Moved to spam', m.spam_moved]].forEach(([k, v]) => { const r = el('div', 'row kv'); r.append(el('span', '', k), el('b', '', String(v || 0))); c.append(r); });
  page.append(c);

// ---------- Live Gmail ----------
async function listThreads(q, max = 20) {
  const r = await gmail(`threads?maxResults=${max}&q=${encodeURIComponent(q)}`);
  const ts = r.threads || [];
  return Promise.all(ts.map(async (t) => {
    const th = await gmail(`threads/${t.id}?format=metadata&metadataHeaders=From&metadataHeaders=Subject`);
    const last = th.messages[th.messages.length - 1];
    const atts = [];
    return { id: t.id, from: hdr(last, 'from'), title: hdr(last, 'subject'), preview: decodeEntities(last.snippet), time: when(last.internalDate), unread: th.messages.some((m) => (m.labelIds || []).includes('UNREAD')), atts: atts.join(', ') };
  }));
}

async function search(q) {
  S.query = q; if (!q) { S.results = null; render(); return; }
  S.results = 'loading'; render();
  // Plain words work; words like "certificate", "pdf", "invoice" also look inside attachments.
  let gq = q.replace(/^(go\s+)?(fetch|find|get|show|search( for)?|open)\s+(me\s+)?(my\s+)?/i, '');
  if (/\b(pdf|certificate|invoice|statement|ticket|document|attachment|file)s?\b/i.test(gq)) gq += ' has:attachment';
  try { S.results = await listThreads(gq, 20); if (!S.results.length) S.results = await listThreads(q, 20); }

function walk(part, out) {
  if (!part) return;
  const mt = part.mimeType || '';
  if (part.filename && part.body && (part.body.attachmentId || part.body.data)) out.atts.push({ name: part.filename, mime: mt, id: part.body.attachmentId, data: part.body.data, size: part.body.size, inline: /inline/i.test((part.headers || []).find((h) => h.name.toLowerCase() === 'content-disposition')?.value || '') });
  else if (mt === 'text/html' && part.body && part.body.data) out.html = out.html || utf8(part.body.data);
  else if (mt === 'text/plain' && part.body && part.body.data) out.text = out.text || utf8(part.body.data);
  (part.parts || []).forEach((p) => walk(p, out));
}

// Ask GitHub for the newest copy of the app and read its version number (0 = nothing newer)
async function newerVersion() {
  try {
    const t = await fetch('./index.html', { cache: 'no-store' }).then((r) => r.text());
    const m = t.match(/const APP_VERSION = (\d+)/);

  } catch (e) { return 0; }
}

}

async function openThread(id, title) { openReader(title); await showThread(id, title); }
async function showThread(id, title) {
  showThread._last = [id, title];
  $('r-title').textContent = title || ''; $('r-extra').style.visibility = 'hidden';
  const body = $('r-body'); body.replaceChildren(el('div', 'spin'));
  try {
    const th = await gmail(`threads/${id}?format=full`);
    body.replaceChildren();
    const unread = th.messages.filter((m) => (m.labelIds || []).includes('UNREAD')).length;
    th.messages.forEach((m) => {
      const out = { atts: [] }; walk(m.payload, out);
      const box = el('div', 'msg');
      box.append(el('h3', '', hdr(m, 'subject') || '(no subject)'), el('div', 'meta', nameOf(hdr(m, 'from')) + ' · ' + new Date(+m.internalDate).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' })));
      if (out.html) {
        const f = el('iframe'); f.setAttribute('sandbox', 'allow-popups allow-popups-to-escape-sandbox'); f.setAttribute('referrerpolicy', 'no-referrer');
        f.srcdoc = '<base target="_blank"><meta name="viewport" content="width=device-width"><style>body{margin:8px;font:15px -apple-system,Roboto,sans-serif;color:#111;word-wrap:break-word}img{max-width:100%;height:auto}table{max-width:100%!important}</style>' + out.html;
        f.onload = () => { try { f.style.height = (f.contentDocument.documentElement.scrollHeight + 20) + 'px'; } catch (e) { f.style.height = '70vh'; } };
        box.append(f);
      } else box.append(el('pre', '', out.text || decodeEntities(m.snippet)));
      const files = out.atts.filter((a) => !(a.inline && /^image\//.test(a.mime)));
      if (files.length) {
        const at = el('div', 'atts');
        files.forEach((a) => { const b = el('button', 'att'); b.append(el('b', '', /pdf/i.test(a.mime) ? '📄' : /^image/.test(a.mime) ? '🖼️' : '📎'), el('span', '', a.name)); b.onclick = () => openAttachment(m.id, a); at.append(b); });
        box.append(at);
      }
      body.append(box);
    });
    // Opening an email marks it read in Gmail too; the top-right button can put it back to unread
    let isUnread = false; if (!unread) setUnread(id, false);
    if (unread) gmail(`threads/${id}/modify`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ removeLabelIds: ['UNREAD'] }) })
      .then(() => { setUnread(id, false); [S.live, Array.isArray(S.results) ? S.results : null].forEach((list) => { const it = list && list.find((x) => x.id === id); if (it) it.unread = false; }); })
      .catch(() => { isUnread = true; paint(); });
    const ex = $('r-extra'); ex.style.visibility = 'visible';
    const paint = () => { ex.textContent = isUnread ? 'Mark read' : 'Unread'; };
    paint();
    ex.onclick = async () => {
      const makeUnread = !isUnread;
      try {
        await gmail(`threads/${id}/modify`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(makeUnread ? { addLabelIds: ['UNREAD'] } : { removeLabelIds: ['UNREAD'] }) });
        isUnread = makeUnread; setUnread(id, isUnread); paint(); toast(isUnread ? 'Marked as unread' : 'Marked as read ✓');
        [S.live, Array.isArray(S.results) ? S.results : null].forEach((list) => { const it = list && list.find((x) => x.id === id); if (it) it.unread = isUnread; });
      } catch (e) { toast('Couldn\'t change it: ' + e.message); }
    };
    // Reply (opens the Gmail app's compose screen with the reply filled in) and open the Gmail app
    const last = th.messages[th.messages.length - 1];
    const replyTo = hdr(last, 'reply-to') || hdr(last, 'from');
    const addr = (replyTo.match(/<([^>]+)>/) || [, replyTo])[1].trim();

    rp.href = 'mailto:' + encodeURIComponent(addr) + '?subject=' + encodeURIComponent(/^re:/i.test(subj) ? subj : 'Re: ' + subj);
    // Find in Gmail app: copy a search for this email, then open the Gmail app so it can be pasted into Gmail's search
    const g = el('a', 'btn ghost', '🔍 Find in Gmail app'); g.style.cssText = 'flex:1;text-decoration:none';
    g.href = gmailLink('#all/' + id);
    // Exact search: sender + subject as a phrase + the day it arrived (one day either side), so only this email matches
    const d0 = new Date(+last.internalDate), ymd = (d) => d.getFullYear() + '/' + (d.getMonth() + 1) + '/' + d.getDate();
    const dayBefore = new Date(d0); dayBefore.setDate(d0.getDate() - 1); const dayAfter = new Date(d0); dayAfter.setDate(d0.getDate() + 1);
    const cleanSubj = subj.replace(/^((re|fwd?|aw):\s*)+/i, '').replace(/"/g, '').trim();
    const findText = [addr ? 'from:' + addr : '', cleanSubj ? 'subject:"' + cleanSubj + '"' : '', 'after:' + ymd(dayBefore), 'before:' + ymd(dayAfter)].filter(Boolean).join(' ');
    g.onclick = async (e) => {
      e.preventDefault();
      try { await navigator.clipboard.writeText(findText); toast('Copied. In Gmail, tap Search and paste.', 4000); } catch (err) { toast('Search Gmail for: ' + findText, 6000); }
      setTimeout(() => { location.href = g.href; }, 900);
    };
    body.append(importanceBox(id, { from: hdr(last, 'from'), from_email: addr, title: subj }));
    acts.append(rp, g); body.append(acts);
    const tip = el('p', 'muted small', 'Find in Gmail app copies this email\'s sender and subject, then opens Gmail. Tap Search in Gmail and paste.');
    tip.style.cssText = 'margin:-18px 16px 30px;text-align:center'; body.append(tip);
  } catch (e) { body.replaceChildren(el('div', 'empty', 'Couldn\'t open this email: ' + e.message)); }
}

async function openAttachment(msgId, a) {
  $('r-title').textContent = a.name;
  const body = $('r-body'); body.replaceChildren(el('div', 'spin'));
  try {
    const data = a.id ? (await gmail(`messages/${msgId}/attachments/${a.id}`)).data : a.data;
    const bytes = b64(data);
    const blob = new Blob([bytes], { type: a.mime || 'application/octet-stream' });
    const file = new File([blob], a.name, { type: blob.type });
    const ex = $('r-extra'); ex.style.visibility = 'visible';
    ex.onclick = async () => {
      if (navigator.canShare && navigator.canShare({ files: [file] })) { try { await navigator.share({ files: [file], title: a.name }); } catch (e) {} }
      else { const u = URL.createObjectURL(blob); const l = el('a'); l.href = u; l.download = a.name; l.click(); setTimeout(() => URL.revokeObjectURL(u), 6e4); }
    };
    body.replaceChildren();
    if (/pdf/i.test(a.mime) || /\.pdf$/i.test(a.name)) {
      const box = el('div'); box.id = 'pdf'; body.append(box);
      const pdf = await pdfjsLib.getDocument({ data: bytes }).promise;
      const w = Math.min(body.clientWidth - 20, 900), dpr = window.devicePixelRatio || 1;
      for (let i = 1; i <= pdf.numPages; i++) {
        const p = await pdf.getPage(i); const v0 = p.getViewport({ scale: 1 }); const v = p.getViewport({ scale: (w / v0.width) * dpr });
        const c = el('canvas'); c.width = v.width; c.height = v.height; c.style.width = w + 'px'; box.append(c);
        await p.render({ canvasContext: c.getContext('2d'), viewport: v }).promise;
      }
    } else if (/^image\//.test(a.mime)) {
      const img = el('img'); img.src = URL.createObjectURL(blob); img.style.cssText = 'max-width:100%;display:block;margin:12px auto'; body.append(img);
    } else {
      const box = el('div', 'msg'); box.append(el('p', '', 'This file type can\'t be shown here. Tap Share to open it in another app.'));
      body.append(box);
    }
  } catch (e) { body.replaceChildren(el('div', 'empty', 'Couldn\'t open the file: ' + e.message)); }
}

// ---------- boot ----------
// Pull down from the top of the main screen to check new mail
(function pullToCheck() {
  const P = $('ptr'), T = $('ptr-t'); let y0 = null, dy = 0;
  const reset = () => { P.style.transition = ''; P.style.transform = ''; };
  addEventListener('touchstart', (e) => {
    const onMain = !$('reader').classList.contains('open') && !S.checking && !S.results && $('app').querySelector('header');
    y0 = (onMain && window.scrollY <= 0) ? e.touches[0].clientY : null; dy = 0;
  }, { passive: true });
  addEventListener('touchmove', (e) => {
    if (y0 == null) return;
    dy = e.touches[0].clientY - y0;
    if (dy <= 0) { reset(); return; }
    P.style.transition = 'none'; P.style.transform = 'translateY(' + (Math.min(dy * 0.5, 80) - 70) + 'px)';
    T.textContent = dy > 140 ? '↻ Release to refresh' : '↓ Pull to check new mail';
  }, { passive: true });
  addEventListener('touchend', () => {
    if (y0 == null) return; y0 = null; P.style.transition = '';
    if (dy > 140) { T.textContent = 'Checking…'; P.style.transform = 'translateY(0)'; liveCheck().finally(reset); }
    else reset();
  });
})();

window.addEventListener('load', () => {
  const r = readRedirect();
  if (r === 'error') { localStorageSet('signedin', ''); signInScreen('Please sign in again to continue.'); return; }
  loadSavedToken(); loadUnread();
  if (S.token) { start(); return; }
  if (localStorageGet('signedin') === '1') {
    // Sign-in has run out: show the saved summary straight away if it is still today's,
    // and only go back to Google when something new is needed (no loading bar on every open)
    const saved = cachedData();
    if (saved && !needsFresh(saved) && S.unreadIds) { S.data = saved; S.feedback = cachedFeedback(); render(); return; }
    goSignIn(true); return; // quietly renews without asking
  }
  signInScreen();
});
</script>
